<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Request a demo · Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,700&display=swap">
<link rel="stylesheet" href="landing.css">
</head>
<body>
<a class="skip" href="#main">Skip to form</a>
<header class="lp-bar">
  <a class="lp-logo" href="/" aria-label="Tally home">
    <svg class="lp-mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#8DA3F1"/><g fill="#1D1D1D"><rect x="27" y="24" width="8" height="52" rx="4"/><rect x="40" y="24" width="8" height="52" rx="4"/><rect x="53" y="24" width="8" height="52" rx="4"/><rect x="66" y="24" width="8" height="52" rx="4"/></g><line x1="20" y1="70" x2="82" y2="38" stroke="#1D1D1D" stroke-width="8" stroke-linecap="round"/></svg>
    <span class="lp-word"><span class="lp-name">Tally</span><span class="lp-sub">Financial audit</span></span>
  </a>
  <a class="lp-login" href="app.html">Log in</a>
</header>

<main id="main" class="demo" tabindex="-1">
  <div class="demo-col">
    <h1>Request a demo</h1>
    <p class="demo-lede">Tell us about your team and we'll show you Tally on a sample of your own budget-vs-actual reporting.</p>
    <div class="demo-card" id="card">
      <!-- shortcut: this form sends nothing anywhere (demo page for the hackathon); wire it to a real endpoint before launch -->
      <form class="demo-form" id="demo-form" novalidate>
        <div class="f"><label for="first">First name</label><input id="first" name="first" autocomplete="given-name" required aria-describedby="first-err"><span class="err" id="first-err"></span></div>
        <div class="f"><label for="last">Last name</label><input id="last" name="last" autocomplete="family-name" required aria-describedby="last-err"><span class="err" id="last-err"></span></div>
        <div class="f full"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err"><span class="err" id="email-err"></span></div>
        <div class="f"><label for="company">Company</label><input id="company" name="company" autocomplete="organization" required aria-describedby="company-err"><span class="err" id="company-err"></span></div>
        <div class="f"><label for="role">Job title <span class="opt">(optional)</span></label><input id="role" name="role" autocomplete="organization-title"><span class="err"></span></div>
        <div class="f full"><label for="size">Finance team size</label>
          <select id="size" name="size" required aria-describedby="size-err">
            <option value="">Choose one</option><option>1–5 people</option><option>6–20 people</option><option>21–100 people</option><option>More than 100</option>
          </select><span class="err" id="size-err"></span></div>
        <div class="f full"><label for="msg">What would you like Tally to check? <span class="opt">(optional)</span></label><textarea id="msg" name="msg" placeholder="For example: monthly budget-vs-actual packs for 12 business units"></textarea></div>
        <button class="lp-login demo-submit full" type="submit">Request a demo</button>
        <p class="demo-note full">This is a demo form. Nothing you type here is sent or saved.</p>
      </form>
    </div>
    <p class="sr-only" id="live" role="status" aria-live="polite"></p>
  </div>
</main>
<script>
const form = document.getElementById('demo-form');
const MSG = {first: 'Enter your first name.', last: 'Enter your last name.', email: 'Enter a work email like name@company.com.', company: 'Enter your company name.', size: 'Choose your team size.'};
form.addEventListener('submit', e => {
  e.preventDefault();
  let firstBad = null;
  for (const [id, msg] of Object.entries(MSG)) {
    const el = document.getElementById(id), bad = !el.value.trim() || !el.checkValidity();
    el.setAttribute('aria-invalid', bad);
    document.getElementById(id + '-err').textContent = bad ? msg : '';
    if (bad && !firstBad) firstBad = el;
  }
  if (firstBad) { firstBad.focus(); return; }
  const name = document.getElementById('first').value.trim();
  const card = document.getElementById('card');
  card.innerHTML = '<div class="demo-done"><h2 tabindex="-1" id="done"></h2><p>This is a demo page, so nothing was sent. In the real product, our team would reply within one business day.</p><p><a href="/">Back to the home page</a></p></div>';
  document.getElementById('done').textContent = 'Thanks, ' + name + '.';
  document.getElementById('done').focus();
  document.getElementById('live').textContent = 'Request received. This is a demo page, so nothing was sent.';
});
</script>
</body>
</html>
