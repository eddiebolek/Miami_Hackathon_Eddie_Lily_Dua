<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar" id="topbar" hidden>
  <a class="brand" href="/">Tally</a>
  <span class="company">
    <label class="sr-only" for="team-pick">Company</label>
    <select id="team-pick" hidden></select>
    <span id="team-name"></span>
  </span>
  <span class="who"><button type="button" class="link" id="sign-out">Sign out</button></span>
</header>
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections" hidden></nav>
<div id="banner" class="banner" role="alert" hidden></div>
<main id="main" tabindex="-1" role="tabpanel"></main>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>
<script type="module" src="main.js"></script>
</body>
</html>
